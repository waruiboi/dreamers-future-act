/* Dreamers Future Act - styles
   Uses only built-in fonts so nothing loads from outside sites. */

:root {
  --navy: #13213f;
  --navy-2: #1f3466;
  --ink: #1c1f26;
  --muted: #586174;
  --bg: #f5f2eb;
  --card: #ffffff;
  --line: #e2dccf;
  --red: #a1262c;
  --gold: #c9a752;
  --fill-bg: #fff1b8;
  --fill-ink: #5e4a00;
  --serif: Georgia, "Times New Roman", Times, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --doc: "Times New Roman", Times, serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: 72px; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.6;
}

a { color: var(--navy-2); }
img { max-width: 100%; height: auto; }

.fill {
  background: var(--fill-bg);

  border-radius: 4px;
  padding: 1px 6px;
  font-style: italic;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

/* ---------- Top navigation ---------- */
.topnav {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--navy);
  border-bottom: 3px solid var(--red);
}
.topnav-inner {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 16px;
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  text-decoration: none;
  white-space: nowrap;
}
.topnav nav { display: flex; gap: 2px; }
.topnav nav a {
  color: #dbe3f3;
  text-decoration: none;
  font-size: 15px;
  padding: 8px 12px;
  border-radius: 6px;
  white-space: nowrap;
}
.topnav nav a:hover,
.topnav nav a:focus-visible { background: rgba(255, 255, 255, 0.12); color: #fff; }

/* ---------- Hero ---------- */
.hero {
  background:

    radial-gradient(circle at 0% 110%, rgba(161, 38, 44, 0.35) 0%, transparent 45%),

  color: #fff;
  text-align: center;
  padding: 64px 16px 120px;
}
.stars { color: var(--gold); letter-spacing: 0.6em; font-size: 14px; margin: 0 0 14px; }

  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
}

  font-family: var(--serif);
  font-size: clamp(38px, 7vw, 62px);
  line-height: 1.08;
  margin: 0 0 18px;
}
.lede { max-width: 640px; margin: 0 auto 22px; font-size: 19px; color: #d4dcee; }
.byline { margin: 0; font-size: 15px; color: #b7c2da; line-height: 2; }

/* ---------- Overview cards ---------- */
.overview {
  position: relative;
  max-width: 1040px;
  margin: -76px auto 0;
  padding: 0 16px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.ov-card {
  display: block;
  background: var(--card);
  color: var(--ink);
  text-decoration: none;
  border-radius: 10px;
  border-top: 4px solid var(--red);

  box-shadow: 0 8px 24px rgba(19, 33, 63, 0.13);

}

main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 72px; }
.section { padding-top: 56px; }

  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding-bottom: 14px;
  margin-bottom: 28px;
  border-bottom: 2px solid var(--line);
}

  flex: none;

  margin-top: 2px;

  color: #fff;

}
.section-head p { margin: 4px 0 0; font-size: 15.5px; color: var(--muted); }

.paper {
  max-width: 816px; /* 8.5in at screen size */

  padding: 72px 80px;

  font-family: var(--doc);
  font-size: 17px;

}
.paper p { margin: 0; }
.double { line-height: 2; }           /* double spacing */
.letter .indent { text-indent: 0.5in; }
.letter .mt { margin-top: 1em; }

/* ---------- Proof of submission ---------- */
.evidence {
  max-width: 816px;
  margin: 28px auto 0;
  padding: 24px;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 5px solid var(--gold);
  border-radius: 8px;
}
.evidence h3 { margin: 0 0 14px; font-family: var(--serif); font-size: 21px; color: var(--navy); }

  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 8px 18px;
  margin: 0 0 20px;
}
.evidence dt { font-weight: 600; color: var(--muted); font-size: 15px; }

.shot-placeholder {
  border: 2px dashed #cbc2ad;

  background: #faf8f3;
  color: var(--muted);
  text-align: center;
  padding: 40px 16px;
}
.shot-icon { display: block; font-size: 30px; margin-bottom: 6px; }
.shot { display: block; border: 1px solid var(--line); border-radius: 8px; }
.helper { margin: 20px 0 0; font-size: 15px; color: var(--muted); }

.btn {
  display: inline-block;

  background: var(--navy);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
}
.btn:hover { background: var(--navy-2); }
.btn.secondary { background: #fff; color: var(--navy); }
.btn.secondary:hover { background: #eef1f8; }

.bill { line-height: 1.8; }
.bill-kicker {

  font-size: 15px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #444;
}
.bill-title { margin: 6px 0 4px; text-align: center; font-family: var(--doc); font-size: 32px; line-height: 1.2; }
.bill-sponsor { text-align: center; font-size: 15px; color: #555; }
.bill-rule { width: 140px; margin: 18px auto 30px; border: 0; border-top: 1px solid #111; }
.bill-purpose { margin-bottom: 20px !important; font-style: italic; }
.bill-sections { margin: 0; padding-left: 1.5em; }
.bill-sections li { margin-bottom: 12px; padding-left: 4px; }
.blank {
  border: 2px dashed #cfc6b2;
  border-radius: 8px;
  background: #fbfaf6;
  color: #7a7466;
  text-align: center;
  font-family: var(--sans);
  font-size: 16px;
  padding: 56px 16px;
}

/* ---------- Works Cited (MLA) ---------- */
.works-cited { line-height: 2; }
.works-cited h3 { margin: 0; text-align: center; font-family: var(--doc); font-size: 17px; font-weight: normal; }
.works-cited p {
  padding-left: 0.5in;      /* hanging indent */
  text-indent: -0.5in;
  overflow-wrap: anywhere;  /* long URLs wrap on phones */
}

}
.link-card {
  display: block;
  padding: 18px 20px;
  background: var(--card);
  color: var(--ink);

  border: 1px solid var(--line);
  border-radius: 10px;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.link-card:hover { border-color: var(--navy-2); transform: translateY(-2px); }
